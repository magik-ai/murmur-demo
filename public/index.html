<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Little Lark · a murmur demo shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>Little Lark</h1>
      <p class="tag">A demo shop built and run by murmur agents.</p>
    </header>
    <main class="layout">
      <section aria-labelledby="shop-title">
        <h2 id="shop-title">Shop</h2>
        <input id="search" type="search" placeholder="Search the shop" aria-label="Search products" autocomplete="off" />
        <div id="products" class="grid"></div>
      </section>
      <aside class="cart" aria-labelledby="cart-title">
        <h2 id="cart-title">Cart (<span id="cart-count">0</span>)</h2>
        <ul id="cart-items"></ul>
        <p class="total">Total <strong id="cart-total">$0.00</strong></p>
      </aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
